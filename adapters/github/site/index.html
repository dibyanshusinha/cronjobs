<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cron Dispatcher Status</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Cron Dispatcher</h1>
    <div id="heartbeat" class="heartbeat">loading…</div>
  </header>

  <main>
    <div id="meta" class="meta"></div>
    <table id="jobs-table">
      <thead>
        <tr>
          <th>Job</th>
          <th>Type</th>
          <th>Schedule</th>
          <th>Last run</th>
          <th>Status</th>
          <th>Next due</th>
        </tr>
      </thead>
      <tbody id="jobs-body">
        <tr><td colspan="6">Loading…</td></tr>
      </tbody>
    </table>
  </main>

  <footer>
    <p>Generated by the dispatcher on every run. Source: <a href="https://github.com" id="repo-link">repo</a>.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cron Dispatcher Status</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Cron Dispatcher</h1>
      <p id="generated" class="subtle">Loading dashboard data...</p>
    </div>
    <div class="top-actions">
      <button id="theme-toggle" class="icon-button" type="button" title="Switch theme" aria-label="Switch theme">☾</button>
      <div id="heartbeat" class="heartbeat unknown">No heartbeat yet</div>
    </div>
  </header>

  <main>
    <section id="summary" class="summary-grid" aria-label="Summary"></section>
    <section id="jobs" class="jobs-grid" aria-label="Jobs">
      <div class="empty-state">Loading jobs...</div>
    </section>
  </main>

  <footer>
    <span id="viewer-tz"></span>
    <a href="https://github.com/dibyanshusinha/cronjobs" rel="noopener noreferrer">Source repository</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>

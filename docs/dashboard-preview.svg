<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">cronjobs dashboard preview</title>
  <desc id="desc">Preview of the cronjobs dashboard showing healthy jobs, scheduler heartbeat, and recent executions.</desc>
  <rect width="1200" height="720" fill="#f6f8fb"/>
  <rect x="0" y="0" width="1200" height="76" fill="#111827"/>
  <text x="48" y="48" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">cronjobs</text>
  <text x="190" y="48" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">GitHub and standalone cron dispatcher</text>
  <rect x="48" y="112" width="1104" height="92" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="72" y="148" fill="#111827" font-family="Arial, sans-serif" font-size="18" font-weight="700">Dispatcher heartbeat</text>
  <circle cx="75" cy="178" r="7" fill="#16a34a"/>
  <text x="92" y="183" fill="#334155" font-family="Arial, sans-serif" font-size="15">Last run successful - 2 jobs loaded - next check in 5 minutes</text>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="236" width="252" height="118" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="72" y="274" fill="#64748b" font-size="14">Total jobs</text>
    <text x="72" y="322" fill="#111827" font-size="42" font-weight="700">2</text>
    <rect x="332" y="236" width="252" height="118" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="356" y="274" fill="#64748b" font-size="14">Success rate</text>
    <text x="356" y="322" fill="#111827" font-size="42" font-weight="700">100%</text>
    <rect x="616" y="236" width="252" height="118" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="640" y="274" fill="#64748b" font-size="14">Failures</text>
    <text x="640" y="322" fill="#111827" font-size="42" font-weight="700">0</text>
    <rect x="900" y="236" width="252" height="118" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="924" y="274" fill="#64748b" font-size="14">Average duration</text>
    <text x="924" y="322" fill="#111827" font-size="42" font-weight="700">412ms</text>
  </g>
  <rect x="48" y="390" width="1104" height="262" rx="8" fill="#ffffff" stroke="#d9e2ec"/>
  <text x="72" y="430" fill="#111827" font-family="Arial, sans-serif" font-size="20" font-weight="700">Jobs</text>
  <line x1="72" y1="458" x2="1128" y2="458" stroke="#e2e8f0"/>
  <g font-family="Arial, sans-serif" font-size="15">
    <text x="72" y="492" fill="#64748b">Name</text>
    <text x="430" y="492" fill="#64748b">Schedule</text>
    <text x="660" y="492" fill="#64748b">Last run</text>
    <text x="880" y="492" fill="#64748b">Status</text>
    <line x1="72" y1="512" x2="1128" y2="512" stroke="#e2e8f0"/>
    <text x="72" y="548" fill="#111827" font-weight="700">Example: ping httpbin</text>
    <text x="430" y="548" fill="#334155">*/15 * * * *</text>
    <text x="660" y="548" fill="#334155">HTTP 200</text>
    <rect x="880" y="528" width="90" height="30" rx="15" fill="#dcfce7"/>
    <text x="904" y="548" fill="#166534" font-weight="700">success</text>
    <line x1="72" y1="574" x2="1128" y2="574" stroke="#e2e8f0"/>
    <text x="72" y="610" fill="#111827" font-weight="700">Example: backup check script</text>
    <text x="430" y="610" fill="#334155">0 3 * * *</text>
    <text x="660" y="610" fill="#334155">exit code 0</text>
    <rect x="880" y="590" width="90" height="30" rx="15" fill="#dcfce7"/>
    <text x="904" y="610" fill="#166534" font-weight="700">success</text>
  </g>
</svg>

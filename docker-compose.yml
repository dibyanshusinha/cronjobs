services:
  cron-dispatcher:
    build: .
    image: cronjobs-standalone:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /app/data
      STATE_BACKEND: sqlite
      SQLITE_PATH: /app/data/cronjobs.sqlite
      JOBS_DIR: /app/jobs
      SCRIPTS_ROOT: /app
      SECRETS_DIR: /run/secrets
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./jobs:/app/jobs:ro
      - ./scripts:/app/scripts:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

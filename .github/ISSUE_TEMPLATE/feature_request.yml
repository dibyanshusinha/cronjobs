name: Feature request
description: Suggest an improvement or new adapter.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep examples public-safe. Do not include private URLs, credentials, or sensitive job details.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scheduler
        - HTTP executor
        - Script executor
        - GitHub adapter
        - Standalone adapter
        - State backend
        - Notifications
        - Dashboard
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

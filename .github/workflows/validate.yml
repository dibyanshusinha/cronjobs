name: Validate job definitions

on:
  push:
    paths:
      - "jobs/**"
      - "schema/**"
      - "src/**"
      - "adapters/github/site/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "jobs/**"
      - "schema/**"
      - "src/**"
      - "adapters/github/site/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run validate

      - run: npm test
